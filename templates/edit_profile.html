{% extends "base.html" %}

{% block content %}

<h1>Edit Profile</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Profile</button>
</form>

<p>
    <a href="{% url 'profile' %}">← Back to Profile</a>
</p>

{% endblock %}
